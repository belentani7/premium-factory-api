name: CI
on: [push, workflow_dispatch]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Protocoles de presencia
        run: |
          test -f README.md && test -f LICENSE && test -f .gitignore
      - name: Compilar Python
        run: python -m compileall -q . -x "(node_modules|\.venv|venv|build|dist)"
      - name: Tests
        run: pip install pytest pytest-timeout 2>/dev/null; pytest -q --timeout=60 2>/dev/null || echo "sin pytest en este repo"
